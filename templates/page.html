<!DOCTYPE html>
<html lang="{{ lang_code }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ topic_label }} ({{ lang_name }}) - Multilingual Podcast Reader</title>
    <link rel="stylesheet" href="assets/reader.css">
</head>
<body class="lang-{{ lang }}">
    <div class="container">
        <header class="page-header">
            <a href="index.html" class="back-link">← Index</a>
            <h1>{{ topic_label }}</h1>
            <div class="lang-badge">{{ lang_name }}</div>
        </header>

        <div class="controls">
            <div class="speech-controls">
                <button id="playPauseBtn" class="play-pause-btn">▶️ Play</button>
                <button id="stopBtn" class="stop-btn">⏹️ Stop</button>
            </div>
        </div>

        <div id="speakerVoices" class="speaker-voices" style="display: none;">
            <div class="collapsible-header" onclick="toggleSpeakerVoices()">
                <h3>🎭 Speaker Voice Assignment & Speed</h3>
                <span id="toggleIcon" class="toggle-icon">▼</span>
            </div>
            <div id="voiceAssignmentContainer" class="voice-assignment collapsed">
                <div class="global-speed-control">
                    <label for="rate">Speed:</label>
                    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="{{ default_rate }}">
                    <span id="rateValue">{{ '%.1f'|format(default_rate) }}x</span>
                </div>
                <div id="speakerControlsContainer" class="speaker-controls-container">
                    <!-- 話者別音声選択は JS で生成 -->
                </div>
            </div>
        </div>

        <div id="textContent" class="text-content">
            {% for line in lines %}
            <div class="line speaker-{{ line.speaker_index }}" data-index="{{ loop.index0 }}" data-speaker="{{ line.speaker }}">
                <span class="speaker-label">{{ line.speaker }}</span>
                <span class="line-text">{{ line.text }}</span>
            </div>
            {% endfor %}
        </div>

        <div id="status" class="status stopped">Ready to play</div>
    </div>

    <script id="page-config" type="application/json">
{{ page_config_json|safe }}
    </script>
    <script src="assets/reader.js"></script>
</body>
</html>
